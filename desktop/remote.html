<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23ffb020%22/%3E%3C/svg%3E" />
    <title>Sightline Remote</title>
  </head>
  <body>
    <div id="start" class="start">
      <h1>Sightline</h1>
      <p>Hold the phone like a TV remote, top edge pointing at the laptop screen.</p>
      <button id="go" type="button">Tap to start</button>
      <p id="start-note" class="note"></p>
    </div>

    <main id="pad" class="pad" hidden>
      <header class="top">
        <div class="status"><span id="dot" class="dot"></span><span id="status">connecting…</span></div>
        <button id="center" type="button" class="center">Center</button>
      </header>

      <section class="buttons">
        <button id="left" type="button" class="click">Click</button>
        <button id="right" type="button" class="click">Right click</button>
        <button id="wheel" type="button" class="click wheel">Menu</button>
      </section>

      <aside id="speed-box" class="speed">
        <small>scroll</small>
        <input id="speed" type="range" min="1" max="30" step="1" value="8" aria-label="Scroll speed" />
        <small><b id="speed-val">8</b>/s</small>
      </aside>

      <p id="orion-text" class="orion-text"></p>
      <p id="heard" class="heard"></p>
    </main>

    <script type="module" src="/src/remote/main.ts"></script>
  </body>
</html>
